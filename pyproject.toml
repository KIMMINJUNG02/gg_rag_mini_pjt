[project]
name = "rag-minipjt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling-core[chunking-openai]>=2.100.0",
    "docling[onnxruntime]>=2.135.0",
    "faiss-cpu>=1.15.1",
    "faiss-gpu>=1.15.1",
    "fastapi>=0.142.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "onnxruntime-gpu>=1.30.0",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.12.0",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

################ 폴더 모듈화할 때 패키지 폴더 바로 접근 가능하게 설정 ################
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "app"]
################################################################################